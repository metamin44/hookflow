version: "2"

# Advisory complexity, style, and formatting configuration for HookFlow.
# Blocking security and correctness linters (gosec, staticcheck, errcheck,
# bodyclose, sqlclosecheck, depguard, bidichk, noctx, nolintlint, etc.) run
# separately in .golangci-security.yml without duplicating analyzers.
# Go version is inherited automatically from go.mod.

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - cyclop
    - funlen
    - gocognit
    - importas
    - misspell
    - nestif
    - prealloc
    - revive
    - unconvert
    - unused
  settings:
    cyclop:
      max-complexity: 20
    funlen:
      lines: 120
      statements: 80
    gocognit:
      min-complexity: 30
    nestif:
      min-complexity: 6
    importas:
      alias:
        - pkg: github.com/metamin44/hookflow/internal/platform/http
          alias: platformhttp
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - cyclop
          - funlen
          - gocognit
          - nestif

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/metamin44/hookflow

issues:
  max-same-issues: 0
  max-issues-per-linter: 0
