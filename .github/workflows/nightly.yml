name: Nightly verification

# Reuses the complete CI matrix instead of duplicating jobs: format/vet/build,
# unit, blocking security lint, secret scanning, workflow security, Trivy
# Compose/image security, ShellCheck, JCS conformance and fuzzing, secret
# envelope fuzzing, RabbitMQ integration (including race), unit race,
# govulncheck, and advisory complexity/style lint.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-ci:
    name: Full CI matrix
    uses: $/.github/workflows/ci.yml
