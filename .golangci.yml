version: "2"

run:
  go: "1.27.4"
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - cyclop
    - depguard
    - durationcheck
    - errcheck
    - errorlint
    - funlen
    - gocognit
    - gosec
    - govet
    - importas
    - ineffassign
    - misspell
    - nestif
    - nilerr
    - prealloc
    - revive
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unused
  settings:
    cyclop:
      max-complexity: 20
    funlen:
      lines: 120
      statements: 80
    gocognit:
      min-complexity: 30
    nestif:
      min-complexity: 6
    depguard:
      rules:
        application-not-command:
          files:
            - "**/internal/app/**"
          deny:
            - pkg: github.com/metamin44/hookflow/cmd
              desc: composition roots must not be imported by application packages
        modules-not-application:
          files:
            - "**/internal/modules/**"
          deny:
            - pkg: github.com/metamin44/hookflow/internal/app
              desc: domain modules must not import the application layer
        platform-not-features:
          files:
            - "**/internal/platform/**"
          deny:
            - pkg: github.com/metamin44/hookflow/internal/app
              desc: platform packages must not import the application layer
            - pkg: github.com/metamin44/hookflow/internal/modules
              desc: platform packages must not import feature modules
        shared-not-internals:
          files:
            - "**/internal/shared/**"
          deny:
            - pkg: github.com/metamin44/hookflow/internal/app
              desc: shared primitives must remain below application services
            - pkg: github.com/metamin44/hookflow/internal/modules
              desc: shared primitives must remain below feature modules
            - pkg: github.com/metamin44/hookflow/internal/platform
              desc: shared primitives must not depend on platform implementations
    importas:
      alias:
        - pkg: github.com/metamin44/hookflow/internal/platform/http
          alias: platformhttp
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - cyclop
          - funlen
          - gocognit
          - gosec
          - nestif

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/metamin44/hookflow

issues:
  max-same-issues: 0
  max-issues-per-linter: 0
