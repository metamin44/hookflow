name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, vet, build, unit, modules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check gofmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Unit tests
        run: go test ./... -count=1
      - name: Verify modules
        run: go mod verify
      - name: Check module tidiness without modifying files
        run: go mod tidy -diff

  security-lint:
    name: Security lint (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run blocking security and correctness linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --config .golangci-security.yml

  secrets:
    name: Secret detection (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks v8.30.1
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSL --retry 3 \
            -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          printf '%s  %s\n' "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan working tree (redacted)
        run: |
          "$RUNNER_TEMP/gitleaks" dir --config .gitleaks.toml --redact=100 --no-banner .
      - name: Scan Git history (redacted)
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact=100 --no-banner .

  workflow-security:
    name: Workflow security (Zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified Zizmor v1.33.1
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 \
            -o "$archive" \
            "https://github.com/zizmorcore/zizmor/releases/download/v1.33.1/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          printf '%s  %s\n' "3e6a301c7a820a2501915f5a9de8c0486da82bdec7965f068477538a98743d43" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" zizmor
          chmod +x "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor" --version
      - name: Audit GitHub Actions workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/zizmor" --persona=pedantic --strict-collection .github/workflows

  container-config-security:
    name: Container & Compose security (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified Trivy v0.76.2
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/trivy_0.76.2_Linux-64bit.tar.gz"
          curl -fsSL --retry 3 \
            -o "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz"
          printf '%s  %s\n' "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" trivy
          chmod +x "$RUNNER_TEMP/trivy"
          "$RUNNER_TEMP/trivy" --version
      - name: Scan Compose and infrastructure configuration (blocking)
        run: |
          "$RUNNER_TEMP/trivy" config --config trivy.yaml --severity HIGH,CRITICAL --exit-code 1 .
      - name: Collect immutable pinned service images
        run: |
          set -euo pipefail
          grep -hEo '[a-z0-9./_-]+:[A-Za-z0-9._-]+@sha256:[a-f0-9]{64}' compose.yaml .github/workflows/ci.yml \
            | sort -u > "$RUNNER_TEMP/hookflow-pinned-images.txt"
          count="$(wc -l < "$RUNNER_TEMP/hookflow-pinned-images.txt")"
          if [ "$count" -lt 3 ]; then
            echo "Expected at least 3 immutable @sha256 pinned service images, found $count"
            exit 1
          fi
          while IFS= read -r image; do
            if [[ ! "$image" =~ ^[a-z0-9./_-]+:[A-Za-z0-9._-]+@sha256:[a-f0-9]{64}$ ]]; then
              echo "Unexpected extracted image reference: $image"
              exit 1
            fi
          done < "$RUNNER_TEMP/hookflow-pinned-images.txt"
          cat "$RUNNER_TEMP/hookflow-pinned-images.txt"
      - name: Scan pinned service images for fixed CRITICAL OS CVEs (blocking)
        run: |
          set -euo pipefail
          while IFS= read -r image; do
            "$RUNNER_TEMP/trivy" image \
              --config trivy.yaml \
              --scanners vuln \
              --pkg-types os \
              --severity CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              "$image"
          done < "$RUNNER_TEMP/hookflow-pinned-images.txt"
      - name: Publish full HIGH/CRITICAL image visibility report
        if: always()
        run: |
          set -euo pipefail
          {
            cat <<'EOF'
          ### Trivy pinned service-image visibility (OS + embedded binaries, HIGH/CRITICAL, fixed only)

          Fixed CRITICAL OS CVEs fail this job above. Full HIGH/CRITICAL visibility (including embedded binaries such as gosu) is published here for digest-refresh triage.
          EOF
            echo
            if [ -f "$RUNNER_TEMP/hookflow-pinned-images.txt" ]; then
              while IFS= read -r image; do
                printf '#### \x60%s\x60\n' "$image"
                printf '\x60\x60\x60\n'
                "$RUNNER_TEMP/trivy" image \
                  --config trivy.yaml \
                  --scanners vuln \
                  --pkg-types os,library \
                  --severity HIGH,CRITICAL \
                  --ignore-unfixed \
                  --exit-code 0 \
                  --quiet \
                  "$image" || true
                printf '\x60\x60\x60\n'
              done < "$RUNNER_TEMP/hookflow-pinned-images.txt"
            else
              echo 'No pinned service images file was produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  shell-checks:
    name: Shell script checks (ShellCheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified ShellCheck v0.11.0
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/shellcheck-v0.11.0.linux.x86_64.tar.xz"
          curl -fsSL --retry 3 \
            -o "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz"
          printf '%s  %s\n' "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198" "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck"
          "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" --version
      - name: Lint shell scripts
        run: |
          "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" scripts/*.sh
      - name: Run static script safety checks
        run: |
          bash scripts/dev-db_test.sh

  jcs-conformance:
    name: JCS conformance (RFC 8785)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify conformance fixtures and reference runtime
        run: |
          # Fails closed: every fixture and the Node.js runtime are required.
          node --version
          test -f internal/platform/jcs/testdata/rfc8785/section-3.2.2-input.json
          test -f internal/platform/jcs/testdata/rfc8785/section-3.2.2-canonical.json
          test -f internal/platform/jcs/testdata/rfc8785/utf16-order-input.json
          test -f internal/platform/jcs/testdata/rfc8785/utf16-order-canonical.json
          test -f internal/platform/jcs/testdata/rfc8785/appendix-b-numbers.tsv
          test -f internal/platform/jcs/testdata/v8/serialize.mjs
      - name: Unit and RFC fixture suite
        run: go test ./internal/platform/jcs -count=1 -v
      - name: V8 and Appendix A reference comparison
        run: go test -tags=v8conf ./internal/platform/jcs -run 'TestV8Conformance' -count=1 -v
      - name: Bounded fuzz Canonicalize (60s)
        run: |
          # Deterministic budget: 60 seconds of fuzzing on the commit under
          # test. A missing fuzz target fails go test; zero executed cases fail
          # the parser gate below, so neither can be reported as success.
          set -o pipefail
          go test -json -run='^$' -fuzz='^FuzzCanonicalize$' -fuzztime=60s ./internal/platform/jcs \
            | tee "$RUNNER_TEMP/hookflow-fuzz.jsonl"
          python3 - "$RUNNER_TEMP/hookflow-fuzz.jsonl" <<'PY'
          import json
          import re
          import sys
          execs = 0
          with open(sys.argv[1], encoding="utf-8") as stream:
              for line in stream:
                  try:
                      row = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if row.get("Action") != "output":
                      continue
                  for count in re.findall(r"execs:\s*(\d+)", row.get("Output", "")):
                      execs = max(execs, int(count))
          if execs == 0:
              print("Fuzz gate executed zero fuzz cases")
              sys.exit(1)
          print("Fuzz gate executed at least", execs, "cases")
          PY
      - name: Fuzz crasher diagnostics
        if: failure()
        run: |
          if [ -d internal/platform/jcs/testdata/fuzz ]; then
            find internal/platform/jcs/testdata/fuzz -type f -print -exec cat {} \;
          fi

  secrets-fuzz:
    name: Secret envelope fuzzing (FuzzDecode)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Bounded fuzz Decode (45s)
        run: |
          # Deterministic budget: 45 seconds of active fuzzing against the v1
          # hfse1. secret envelope parser. Zero executed cases fail the gate.
          set -o pipefail
          go test -json -run='^$' -fuzz='^FuzzDecode$' -fuzztime=45s ./internal/platform/secrets \
            | tee "$RUNNER_TEMP/hookflow-secrets-fuzz.jsonl"
          python3 - "$RUNNER_TEMP/hookflow-secrets-fuzz.jsonl" <<'PY'
          import json
          import re
          import sys
          execs = 0
          with open(sys.argv[1], encoding="utf-8") as stream:
              for line in stream:
                  try:
                      row = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if row.get("Action") != "output":
                      continue
                  for count in re.findall(r"execs:\s*(\d+)", row.get("Output", "")):
                      execs = max(execs, int(count))
          if execs == 0:
              print("FuzzDecode gate executed zero fuzz cases")
              sys.exit(1)
          print("FuzzDecode gate executed at least", execs, "cases")
          PY
      - name: Fuzz crasher summary (paths only, no raw secret dump)
        if: failure()
        run: |
          if [ -d internal/platform/secrets/testdata/fuzz ]; then
            echo "FuzzDecode produced failing corpus entries:"
            find internal/platform/secrets/testdata/fuzz -type f -printf '%p (%s bytes)\n'
          fi

  integration:
    name: Integration (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - rabbitmq: "4.4.1"
            label: "4.4.1, race"
            race: "true"
            image: rabbitmq:4.4.1-management-alpine@sha256:2b47b1aa05ec7e373950ad2e9200e9f95a9da7039c8d22c19dbf5a59101362c4
          - rabbitmq: "4.3.8"
            label: "4.3.8"
            race: "false"
            image: rabbitmq:4.3.8-management-alpine@sha256:977a6cf07ea9065116aaa40e7dc147ad25621d71a654248d36d79e5e7500be3e
    services:
      postgres:
        image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
        env:
          POSTGRES_DB: hookflow_ci
          POSTGRES_USER: hookflow
          # Disposable credentials for the isolated CI service only.
          POSTGRES_PASSWORD: hookflow-ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hookflow -d hookflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: ${{ matrix.image }}
        env:
          RABBITMQ_DEFAULT_USER: hookflow
          # Disposable credentials for the isolated CI service only.
          RABBITMQ_DEFAULT_PASS: hookflow-ci-rabbitmq
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
    env:
      HOOKFLOW_DB_NAME: hookflow_ci
      HOOKFLOW_DB_USER: hookflow
      HOOKFLOW_DB_PASSWORD: hookflow-ci-postgres
      HOOKFLOW_DB_HOST: 127.0.0.1
      HOOKFLOW_DB_PORT: "5432"
      HOOKFLOW_DB_SSLMODE: disable
      HOOKFLOW_RABBITMQ_URI: amqp://hookflow:hookflow-ci-rabbitmq@127.0.0.1:5672/%2F
      HOOKFLOW_RABBITMQ_MANAGEMENT_URL: http://127.0.0.1:15672
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Apply migrations
        run: go run ./cmd/migrate up
      - name: Integration tests (no skipped gates)
        env:
          INTEGRATION_RACE: ${{ matrix.race }}
          CGO_ENABLED: "1"
        run: |
          set -o pipefail
          race_flags=()
          if [ "$INTEGRATION_RACE" = "true" ]; then
            race_flags=(-race)
          fi
          go test "${race_flags[@]}" -json -tags=integration ./... -count=1 -p 1 \
            | tee "$RUNNER_TEMP/hookflow-integration.jsonl"
          python3 - "$RUNNER_TEMP/hookflow-integration.jsonl" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              # Package-level skip events without a Test name only mean "no test
              # files"; a skipped test always carries a Test name and fails.
              skipped = [
                  row for line in stream
                  if (row := json.loads(line)).get("Action") == "skip" and row.get("Test")
              ]
          if skipped:
              for row in skipped:
                  print("Required integration gate skipped:", row.get("Package"), row.get("Test", ""))
              sys.exit(1)
          PY
      - name: Prove down and up migrations
        run: |
          go run ./cmd/migrate down 14
          go run ./cmd/migrate up
          go run ./cmd/migrate version

  race:
    name: Race detector (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Race tests
        run: go test -race ./... -count=1

  vulnerability:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install pinned govulncheck
        run: |
          # The module version is the reproducibility pin. govulncheck exits 3
          # only for reachable (symbol) findings; package/module-only findings
          # are reported without modifying go.mod or go.sum.
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          "$(go env GOPATH)/bin/govulncheck" -version
      - name: Scan source and required modules
        run: |
          set -o pipefail
          "$(go env GOPATH)/bin/govulncheck" -show=verbose ./... | tee "$RUNNER_TEMP/hookflow-govulncheck.txt"
      - name: Publish vulnerability findings
        if: always()
        run: |
          {
            cat <<'EOF'
          ### govulncheck

          Reachable (symbol) findings fail this job. Package and module findings that no code path reaches are reported below; this workflow never edits go.mod or go.sum to suppress them.
          EOF
            echo
            printf '\x60\x60\x60\n'
            if [ -f "$RUNNER_TEMP/hookflow-govulncheck.txt" ]; then
              if grep -q '^=== Symbol Results ===' "$RUNNER_TEMP/hookflow-govulncheck.txt"; then
                sed -n '/^=== Symbol Results ===/,$p' "$RUNNER_TEMP/hookflow-govulncheck.txt"
              else
                cat "$RUNNER_TEMP/hookflow-govulncheck.txt"
              fi
            else
              echo 'No govulncheck output was produced.'
            fi
            printf '\x60\x60\x60\n'
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Complexity & style lint (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run advisory complexity and style linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        continue-on-error: true
        with:
          version: v2.15.0
