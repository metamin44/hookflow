name: hookflow

services:
  postgres:
    image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    container_name: hookflow-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${HOOKFLOW_DB_NAME:-hookflow_dev}
      POSTGRES_USER: ${HOOKFLOW_DB_USER:-hookflow}
      POSTGRES_PASSWORD: "${HOOKFLOW_DB_PASSWORD:?set HOOKFLOW_DB_PASSWORD in .env}"
    ports:
      - "127.0.0.1:${HOOKFLOW_DB_PORT:-5433}:5432"
    volumes:
      - hookflow-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.4.1-management-alpine@sha256:2b47b1aa05ec7e373950ad2e9200e9f95a9da7039c8d22c19dbf5a59101362c4
    container_name: hookflow-rabbitmq-dev
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: "${HOOKFLOW_RABBITMQ_USER:?set HOOKFLOW_RABBITMQ_USER in .env}"
      RABBITMQ_DEFAULT_PASS: "${HOOKFLOW_RABBITMQ_PASSWORD:?set HOOKFLOW_RABBITMQ_PASSWORD in .env}"
    ports:
      - "127.0.0.1:${HOOKFLOW_RABBITMQ_AMQP_PORT:-5673}:5672"
      - "127.0.0.1:${HOOKFLOW_RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    volumes:
      - hookflow-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmqctl -q await_startup"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

volumes:
  hookflow-postgres-data:
    name: hookflow-postgres-data
  hookflow-rabbitmq-data:
    name: hookflow-rabbitmq-data
